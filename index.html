<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Pedidos de Transporte CPSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra lateral escura de navegação + área de trabalho clara com faixas de filtros, cartões de indicadores e tabelas densas. */
:root{
  --bg:#EDF0F3; --panel:#FFFFFF; --panel2:#F6F8FA; --ink:#17212B; --muted:#5A6672; --line:#D5DBE1;
  --side:#17212B; --side-fg:#BCC6D0; --side-hi:#FFFFFF;
  --accent:#D98E10; --accent-ink:#4A3000; --focus:#2C5CA6;
  --own:#2C5CA6; --ext:#C0541B;
  --ok:#2E7A4E; --warn:#A86A12; --bad:#B42318; --info:#2C5CA6; --idle:#6B7682;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151B; --panel:#17202A; --panel2:#1C2632; --ink:#E5EAF0; --muted:#94A1AE; --line:#2B3744;
  --side:#0A0F14; --side-fg:#9AA7B4; --side-hi:#FFFFFF;
  --accent:#F0AE3C; --accent-ink:#2A1A00; --focus:#7AA6EA;
  --own:#6F9DE2; --ext:#E68A4E; --ok:#5DBF88; --warn:#E2B04E; --bad:#F2725F; --info:#7AA6EA; --idle:#8D99A6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B; --panel:#17202A; --panel2:#1C2632; --ink:#E5EAF0; --muted:#94A1AE; --line:#2B3744;
  --side:#0A0F14; --side-fg:#9AA7B4; --side-hi:#FFFFFF;
  --accent:#F0AE3C; --accent-ink:#2A1A00; --focus:#7AA6EA;
  --own:#6F9DE2; --ext:#E68A4E; --ok:#5DBF88; --warn:#E2B04E; --bad:#F2725F; --info:#7AA6EA; --idle:#8D99A6;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.1} h2{font-size:20px} h3{font-size:16px;letter-spacing:.03em;text-transform:uppercase}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} small{color:var(--muted)}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;overflow:auto;padding:18px 12px 24px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px 10px;border-bottom:1px solid color-mix(in srgb,var(--side-fg) 20%,transparent)}
.brand b{font-family:var(--f-display);font-size:22px;color:var(--side-hi);letter-spacing:.02em}
.brand span{font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;color:var(--side-fg);text-decoration:none;font-weight:500}
.nav a:hover{background:color-mix(in srgb,var(--side-fg) 10%,transparent);color:var(--side-hi)}
.nav a.on{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--side-hi);box-shadow:inset 3px 0 0 var(--accent)}
.ng{display:flex;flex-direction:column;gap:1px;margin-bottom:10px}
.nav a.ngh{font-weight:600;color:var(--side-hi)}
.ngh.lab{padding:6px 10px 3px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--side-fg)}
.nav a.nsub{padding:6px 10px 6px 14px;font-weight:400;font-size:13px}
.nn{font-family:var(--f-mono);font-size:11px;opacity:.6;margin-right:8px;display:inline-block;min-width:22px;flex-shrink:0}
.nav a>span,.ngh.lab{display:flex;align-items:baseline;min-width:0}
.nav .cnt{font-family:var(--f-mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 6px}
.whoami{margin-top:auto;font-size:12px;padding:10px 8px 0;border-top:1px solid color-mix(in srgb,var(--side-fg) 20%,transparent);display:flex;gap:8px;align-items:center}
.whoami img{width:26px;height:26px;border-radius:50%}
.whoami b{color:var(--side-hi);font-weight:600;display:block}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .search{flex:1;max-width:460px;position:relative}
.top .search input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.top .search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted)}
.menu-btn{display:none}
.content{padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1440px;width:100%}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.phead p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

a.btn{text-decoration:none;color:inherit}
.ctx{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.25);min-width:210px;max-width:320px;padding:4px;display:flex;flex-direction:column}
.ctx-h{padding:6px 10px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px;overflow-wrap:anywhere}
.ctx-h b{color:var(--ink)}
.ctx button{all:unset;padding:7px 10px;border-radius:4px;cursor:pointer;font-size:13px}
.ctx button:hover,.ctx button:focus-visible{background:var(--panel2)} .ctx button.bad{color:var(--bad);font-weight:600}
.hint-del{margin:-8px 0 0;font-size:12px;color:var(--muted)}
.chk input,.fld .chk input{width:auto;flex:none;padding:0}
.fld .chk{font-weight:400}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px;cursor:pointer;display:inline-flex}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;font-family:var(--f-mono);border-radius:8px;padding:0 5px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel>h3{margin-bottom:10px}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:default}
.kpi.click{cursor:pointer} .kpi.click:hover{border-color:var(--muted)}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.warn{box-shadow:inset 3px 0 0 var(--warn)} .kpi.bad{box-shadow:inset 3px 0 0 var(--bad)} .kpi.ok{box-shadow:inset 3px 0 0 var(--ok)}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.filters .fld{min-width:130px;flex:1 1 140px;max-width:220px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--muted)}
.fld em{color:var(--bad);font-style:normal}
.fld input,.fld select,.fld textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);min-width:0}
.fld textarea{resize:vertical}
.fld small{font-size:11px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500}
.form-sec{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.form-sec>header{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2);border-radius:8px 8px 0 0}
.form-sec>header .k{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.form-sec>div{padding:14px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.form-sec .full{grid-column:1/-1}
.lines{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(180px,2fr) repeat(4,minmax(90px,1fr)) auto;gap:8px;align-items:end;padding:10px;border:1px dashed var(--line);border-radius:6px}
.note{padding:10px 12px;border-radius:6px;background:color-mix(in srgb,var(--info) 10%,transparent);border:1px solid color-mix(in srgb,var(--info) 30%,transparent);font-size:13px}
.note.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.note.bad{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--panel2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;position:sticky;top:0}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--focus)}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
tr:last-child td{border-bottom:0}
.pager{display:flex;justify-content:flex-end;gap:8px;align-items:center;padding-top:8px;font-size:12px;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.c-idle{color:var(--idle);background:color-mix(in srgb,var(--idle) 14%,transparent)}
.c-info{color:var(--info);background:color-mix(in srgb,var(--info) 14%,transparent)}
.c-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.c-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.c-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.c-own{color:var(--own);border-color:color-mix(in srgb,var(--own) 45%,transparent)}
.c-ext{color:var(--ext);border-color:color-mix(in srgb,var(--ext) 50%,transparent);background:color-mix(in srgb,var(--ext) 8%,transparent)}
.pn{font-family:var(--f-mono);font-size:12px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);white-space:nowrap}
.plate{font-family:var(--f-mono);font-size:12px;padding:0 6px;border:1px solid var(--ink);border-radius:3px;letter-spacing:.06em;white-space:nowrap}

.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:13px;background:none;border:0;padding:2px 0;text-align:left;width:100%}
button.bar{cursor:pointer} button.bar:hover .lab{text-decoration:underline}
.bar .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:12px;background:var(--panel2);border-radius:3px;overflow:hidden;display:flex}
.bar .fill{height:100%;background:var(--ink)}
.bar .fill.own{background:var(--own)} .bar .fill.ext{background:var(--ext)} .bar .fill.acc{background:var(--accent)}
.bar .fill.ok{background:var(--ok)} .bar .fill.bad{background:var(--bad)} .bar .fill.idle{background:var(--idle)}
.bar .val{font-family:var(--f-mono);font-size:12px;min-width:3.5ch;text-align:right}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.def{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

.cal-week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:6px;min-width:920px}
.cal-month{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:4px;min-width:780px}
.cal-day{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;min-height:110px;display:flex;flex-direction:column;gap:4px}
.cal-day.today{border-color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
.cal-day.out{opacity:.5}
.cal-day .dh{font-size:11px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.cal-wh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 4px}
.ev{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--own);background:var(--panel2);border-radius:4px;padding:4px 6px;font-size:12px;cursor:pointer;line-height:1.3}
.ev.ext{border-left-color:var(--ext)} .ev.none{border-left-color:var(--idle);border-left-style:dashed}
.ev.urg{box-shadow:inset 0 0 0 1px var(--bad)}
.ev b{font-family:var(--f-mono);font-weight:500;font-size:11px}
.ev .x{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daylist .ev{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px 10px;font-size:13px}
.daylist .t{font-family:var(--f-mono);font-size:14px}
.conf{display:flex;flex-direction:column;gap:6px;font-size:13px}
.conf .it{padding:8px 10px;border-radius:6px;border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 7%,transparent);display:flex;flex-direction:column;gap:4px}
.conf .it b{font-weight:600}

.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(860px,100%);height:100%;overflow:hidden;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.25)}
.drawer.narrow{width:min(560px,100%)}
.dhd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.mbody{flex:1;overflow:auto;padding:16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.dft{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--panel);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
dl.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 14px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tl{display:flex;flex-direction:column;gap:0;font-size:13px}
.tl div{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.notif{position:absolute;right:12px;top:52px;width:min(400px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:30}
.notif .n{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.notif .n.new{box-shadow:inset 3px 0 0 var(--accent)}
.notif .n:hover{background:var(--panel2)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:60;max-width:calc(100vw - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.banner{background:color-mix(in srgb,var(--accent) 20%,var(--bg));border-bottom:1px solid var(--accent);padding:6px 16px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.center{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px}
.center .panel{max-width:560px}
.sum{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.tipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;padding:14px}
.tipo{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:12px;cursor:pointer}
.tipo:hover{border-color:var(--muted)}
.tipo.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.tipo .k{font-family:var(--f-mono);font-size:12px;color:var(--accent)} .tipo b{font-weight:600;line-height:1.25} .tipo small{font-size:12px}
.maqpick{display:flex;flex-direction:column;gap:8px;min-width:0}
.mlist{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.mrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:7px 10px;cursor:pointer}
.mrow:hover{background:var(--panel2)} .mrow.on{background:color-mix(in srgb,var(--info) 11%,transparent)}
.mrow .mt{min-width:0} .mrow small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .num{font-size:12px;color:var(--muted);white-space:nowrap}
.mrow .ck{width:18px;height:18px;border:1px solid var(--muted);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--info)}
.maq-res{display:flex;flex-direction:column;gap:6px;min-width:0}
.plan-slot{height:calc(100vh - 170px);min-height:420px}
#planHost{position:fixed;z-index:4;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0f1720}
#planHost iframe{width:100%;height:100%;border:0;display:block}
.pc-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:6px}

"use strict";
try{if(localStorage.getItem("cpsa_side")==="off")window.__sideOff=true;window.__planoVista=localStorage.getItem("cpsa_plano")||"";}catch(e){}
const TEMAS={auto:"Automático (segue o sistema)",light:"Claro",dark:"Escuro"};
function temaAtual(){try{const t=localStorage.getItem("cpsa_tema");return TEMAS[t]?t:"auto";}catch(e){return "auto";}}
function temaEfetivo(t){return t==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;}
function syncPlanTema(){try{const f=document.querySelector("#planHost iframe");if(f&&f.contentDocument&&f.contentDocument.documentElement)f.contentDocument.documentElement.setAttribute("data-theme",temaEfetivo(temaAtual()));}catch(e){}}
function aplicaTema(t){const r=document.documentElement;if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);syncPlanTema();}
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(temaAtual()==="auto")syncPlanTema();});}catch(e){}
aplicaTema(temaAtual());
/* ========== utilitários ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nowISO=()=>new Date().toISOString();
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const TZ="Europe/Lisbon";
const _fmtP=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",weekday:"short",hourCycle:"h23"});
function partsLis(d){const p={};_fmtP.formatToParts(d).forEach(x=>p[x.type]=x.value);return p;}
function toInput(iso){if(!iso)return"";const p=partsLis(new Date(iso));return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;}
function fromInput(v){if(!v)return null;const[d,t]=v.split("T");const[y,m,dd]=d.split("-").map(Number);const[hh,mi]=(t||"00:00").split(":").map(Number);
  const target=Date.UTC(y,m-1,dd,hh,mi);let g=target;for(let i=0;i<3;i++){const p=partsLis(new Date(g));const as=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute);g+=target-as;}return new Date(g).toISOString();}
function dayStartISO(k){return fromInput(k+"T00:00");}
function dayKey(iso){const p=partsLis(new Date(iso));return `${p.year}-${p.month}-${p.day}`;}
function todayKey(){return dayKey(nowISO());}
function addDays(k,n){const[y,m,d]=k.split("-").map(Number);const t=new Date(Date.UTC(y,m-1,d+n));return t.toISOString().slice(0,10);}
function dow(k){const[y,m,d]=k.split("-").map(Number);return (new Date(Date.UTC(y,m-1,d)).getUTCDay()+6)%7;} // 0=seg
const DT_KEYS=[["pretendidaEm","00:00","pretendidaSemHora"],["periodoInicio","00:00","inicioSemHora"],["periodoFim","23:59","fimSemHora"]];
function dtSync(F){DT_KEYS.forEach(([k,def])=>{if(F[k+"_d"]===undefined){const v=F[k]||"";F[k+"_d"]=v?v.slice(0,10):"";F[k+"_h"]=v&&!F[k+"_semHora"]?v.slice(11,16):"";}const d=F[k+"_d"],h=F[k+"_h"];F[k]=d?`${d}T${h||def}`:"";F[k+"_semHora"]=!!d&&!h;});}
function dtFlds(k,label,req,hint){return `<div class="dtpair">${fld(`form.${k}_d`,label,{type:"date",req})}${fld(`form.${k}_h`,"Hora (opcional)",{type:"time",hint})}</div>`;}
function fmtPed(iso,semHora){return semHora&&iso?fmtD(dayKey(iso)):fmtDT(iso);}
function fmtDT(iso){if(!iso)return"—";const p=partsLis(new Date(iso));return `${p.day}/${p.month}/${p.year} ${p.hour}:${p.minute}`;}
function fmtD(k){if(!k)return"—";const[y,m,d]=k.split("-");return `${d}/${m}/${y}`;}
function fmtT(iso){const p=partsLis(new Date(iso));return `${p.hour}:${p.minute}`;}
function fmtDur(ms){if(ms==null||isNaN(ms))return"—";const neg=ms<0;ms=Math.abs(ms);const m=Math.round(ms/60000);const d=Math.floor(m/1440),h=Math.floor((m%1440)/60),mm=m%60;
  return (neg?"−":"")+(d?`${d} d ${h} h`:h?`${h} h ${String(mm).padStart(2,"0")} min`:`${mm} min`);}
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const DIAS=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
function eur(v){return v==null||v===""||isNaN(v)?"—":new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"}).format(v);}
function pct(v){return v==null?"Sem dados":v.toLocaleString("pt-PT",{maximumFractionDigits:1})+" %";}
function numOr(v){const n=parseFloat(String(v).replace(",","."));return isNaN(n)?null:n;}
function avg(a){a=a.filter(x=>x!=null&&!isNaN(x));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null;}
function groupBy(list,fn){const m=new Map();list.forEach(x=>{const k=fn(x);if(k==null)return;if(!m.has(k))m.set(k,[]);m.get(k).push(x);});return m;}
function periodKey(iso,gran){const k=dayKey(iso);const[y,m]=k.split("-");
  if(gran==="dia")return k; if(gran==="mes")return `${y}-${m}`; if(gran==="trimestre")return `${y}-T${Math.ceil(+m/3)}`; if(gran==="ano")return y;
  const d=dow(k);const mon=addDays(k,-d);return "S "+mon;}

function inRange(iso,de,ate){if(!de&&!ate)return true;if(!iso)return false;const k=dayKey(iso);return (!de||k>=de)&&(!ate||k<=ate);}

/* ========== constantes de domínio ========== */
const ESTADOS=["Rascunho","Pendente de aprovação","Devolvido para correção","Rejeitado","Aprovado","Por agendar","Agendado","Em execução","Concluído","Cancelado"];
const FINAIS=["Concluído","Rejeitado","Cancelado"];
const EST_CLS={"Rascunho":"c-idle","Pendente de aprovação":"c-warn","Devolvido para correção":"c-warn","Rejeitado":"c-bad","Aprovado":"c-info","Por agendar":"c-info","Agendado":"c-info","Em execução":"c-ok","Concluído":"c-ok","Cancelado":"c-idle"};
const PRIOS=[["baixa","Baixa"],["normal","Normal"],["alta","Alta"],["urgente","Urgente"]];

function conviteMeu(){const n=normNome(S.prof[S.me.id]?.name||S.me.name);const em=normEmail(S.me.email||"");return S.d.convites.find(c=>c.usadoPor===S.me.id&&c.ativo!==false)||(em?S.d.convites.find(c=>c.ativo!==false&&!c.usadoPor&&normEmail(c.email)===em):null)||(n?S.d.convites.find(c=>c.ativo!==false&&!c.usadoPor&&c.perfil!=="admin"&&normNome(c.nome)===n):null)||null;}
function realRole(){if(S.me.isOwner)return"admin";const u=M.user?.[S.me.id];if(u)return u.ativo!==false?u.perfil:null;const c=conviteMeu();if(c)return c.perfil;return null;}
function role(){const r=realRole();if(r==="admin"&&S.sim)return S.sim;if(r)return r;return S.me.canWrite===false?"consulta":null;}
/* Acessos por perfil — configuráveis pelo administrador em Utilizadores (cfg/perfis) */
const PERM_PAG=[["dashboard","1 · Dashboard"],["relatorios","1.1 · Relatórios e análises"],["pedidos","2.1 · Lista de pedidos"],["agenda","3 · Planeamento (plano de cargas e calendário)"],["planeamento","3.1 · Auxílio ao planeamento de máquinas"],["viagens","3.2 · Auxílio aos tempos de viagens"],["frota","4.1 · Frota própria"],["externos","4.2 · Veículos externos"],["obras","4.3 · Obras/Clientes"],["materiais","4.4 · Máquinas e materiais"]];
const PERM_ACO=[["criar","Criar pedidos","Mostra 2.2 Novo pedido"],["gerir","Gerir todos os pedidos","Aprovar, agendar, editar e cancelar pedidos de outros, importar pedidos de cisternas. Mostra 2.3 Aprovações"],["defs","Editar definições","Criar e editar frota própria, veículos externos, transportadoras e obras"],["exportar","Exportar","Listas e planos em Excel e PDF"]];
const PERFIS_CFG=["logistica","consulta"];
const PERM_DEF={logistica:{pag:Object.fromEntries(PERM_PAG.map(p=>[p[0],true])),aco:{criar:true,gerir:true,defs:true,exportar:true}},
  consulta:{pag:Object.fromEntries(PERM_PAG.map(p=>[p[0],true])),aco:{criar:false,gerir:false,defs:false,exportar:true}},
  obra:{pag:Object.fromEntries(PERM_PAG.map(p=>[p[0],!["frota","planeamento","viagens"].includes(p[0])])),aco:{criar:true,gerir:false,defs:false,exportar:true}}};
function permCfg(){return (S.d.cfg||[]).find(c=>c.id==="perfis")||{};}
function perm(grp,k,r){r=r||role();if(r==="admin")return true;if(!r)return false;const c=permCfg()[r];const v=c&&c[grp]?c[grp][k]:undefined;if(typeof v==="boolean")return v;const d=PERM_DEF[r];return !!(d&&d[grp]&&d[grp][k]);}
const ROLES_UI=()=>Object.entries(ROLE_LABEL).filter(r=>r[0]!=="obra");
const can={
  admin:()=>role()==="admin",
  log:()=>perm("aco","gerir"),
  pedido:()=>perm("aco","criar"),
  obra:()=>perm("aco","defs"),
  defs:()=>perm("aco","defs"),
  exp:()=>perm("aco","exportar"),
  write:()=>role()!=="consulta"
};
function gestorUser(o){const g=M.gest&&M.gest[o.gestorId];return g?(g.utilizadorId||null):(o.gestorId||null);}
function gestorNome(id){if(!id)return"—";const g=M.gest&&M.gest[id];return g?g.nome:nome(id);}
const EMPRESAS=[["CPSA","CPSA"],["PTSA","Pragosa Transportes"]];
const gEmp=g=>g.empresas||[],gEq=g=>g.equipamentos||[],gZo=g=>(g.zonas&&g.zonas.length)?g.zonas:(g.zonaId?[g.zonaId]:[]);
function vEmpresa(v){return v.virtual?"CPSA":(v.empresa||"");}
function gestorCobreViatura(g,v){return(!gEmp(g).length||gEmp(g).includes(vEmpresa(v)))&&(!gEq(g).length||vEqs(v).some(e=>gEq(g).includes(e)))&&(!gZo(g).length||gZo(g).includes(vZona(v)));}
function gestorCobrePedido(g,p){const via=p.recurso&&p.recurso.viaturaId?M.via[p.recurso.viaturaId]:null;
  const okEq=!gEq(g).length||(p.equipamentoId&&gEq(g).includes(p.equipamentoId))||(!p.equipamentoId&&p.categoriaId&&gEq(g).some(e=>M.eq[e]?.categoriaId===p.categoriaId))||(via&&gestorCobreViatura(g,via));
  const okEmp=!via||gestorCobreViatura(g,via)||!gEmp(g).length;const okZ=!gZo(g).length||!zonaOf(p)||gZo(g).includes(zonaOf(p));return !!(okEq&&okEmp&&okZ);}
/* Gestores responsáveis = utilizadores com perfil Gestor de logística (criados em Utilizadores). A ficha de gestor guarda só a cobertura. */
function pessoaLog(g){if(!g)return null;const u=g.utilizadorId&&M.user[g.utilizadorId];if(u&&u.ativo!==false&&u.perfil==="logistica")return {t:"user",id:u.id,nome:nome(u.id)};
  const c=g.conviteId&&M.conv&&M.conv[g.conviteId];if(c&&c.ativo!==false&&c.perfil==="logistica"){if(c.usadoPor){const u2=M.user[c.usadoPor];return u2&&u2.ativo!==false&&u2.perfil==="logistica"?{t:"user",id:u2.id,nome:nome(u2.id)}:null;}return {t:"convite",id:c.id,nome:c.nome};}return null;}
function gAtivo(g){return g.ativo!==false&&!!pessoaLog(g);}
const gSemCob=g=>!gEq(g).length&&!gEmp(g).length&&!gZo(g).length;
let _gsDone=new Set();
async function syncGestores(){if(!db||realRole()!=="admin"||!["utilizadores","convites","gestores"].every(c=>S.loaded[c]))return;
  const pess=[...S.d.utilizadores.filter(u=>u.ativo!==false&&u.perfil==="logistica").map(u=>({k:"u:"+u.id,uid:u.id,nome:nome(u.id)!=="Utilizador"?nome(u.id):(u.alcunha||""),email:u.email||""})),
    ...S.d.convites.filter(c=>c.ativo!==false&&!c.usadoPor&&c.perfil==="logistica").map(c=>({k:"c:"+c.id,cid:c.id,nome:c.nome,email:c.email||""}))];
  for(const p of pess){if(_gsDone.has(p.k))continue;_gsDone.add(p.k);
    const em=x=>p.email&&x.email&&normNome(x.email)===normNome(p.email);
    let g=S.d.gestores.find(x=>(p.uid&&x.utilizadorId===p.uid)||(p.cid&&x.conviteId===p.cid));
    if(!g)g=S.d.gestores.find(x=>!pessoaLog(x)&&(em(x)||(p.nome&&normNome(x.nome)===normNome(p.nome))));
    try{if(g){const up={};if(p.uid&&g.utilizadorId!==p.uid)up.utilizadorId=p.uid;if(p.cid&&g.conviteId!==p.cid)up.conviteId=p.cid;if(!g.email&&p.email)up.email=p.email;if(p.nome&&g.nome!==p.nome)up.nome=p.nome;if(Object.keys(up).length)await db.doc("gestores/"+g.id).update(up);}
      else await db.collection("gestores").doc().set({nome:p.nome||"Gestor",funcao:"Gestor de logística",empresas:[],equipamentos:[],zonas:[],zonaId:null,contacto:"",email:p.email,utilizadorId:p.uid||null,conviteId:p.cid||null,ativo:true,criadoEm:nowISO(),criadoPor:S.me.id,criadoAuto:true});}catch(e){console.warn(e);}}}
function gestoresDoPedido(p){return S.d.gestores.filter(g=>gAtivo(g)&&(gEq(g).length||gZo(g).length||gEmp(g).length)&&gestorCobrePedido(g,p));}
function filtroGestor(p,id,comCriador){const g=M.gest&&M.gest[id];if(g)return gestorCobrePedido(g,p)||p.logisticaId==="g:"+id||(!!g.utilizadorId&&p.logisticaId===g.utilizadorId);return p.logisticaId===id||M.obra[p.obraId]?.gestorId===id||(comCriador&&p.criadoPor===id);}
function obraVisivel(o){if(role()!=="obra")return true;return gestorUser(o)===S.me.id||o.criadoPor===S.me.id;}
function pedidoVisivel(p){if(role()!=="obra")return true;const o=M.obra[p.obraId];return p.criadoPor===S.me.id||(o&&obraVisivel(o));}
function podeEditar(p){if(!["Rascunho","Devolvido para correção"].includes(p.estado))return false;return p.criadoPor===S.me.id||can.log();}
function podeCancelar(p){if(FINAIS.includes(p.estado))return false;if(can.log())return true;return p.criadoPor===S.me.id&&["Rascunho","Pendente de aprovação","Devolvido para correção"].includes(p.estado);}
function nome(id){if(!id)return"—";if(String(id).startsWith("g:")){const g=M.gest&&M.gest[id.slice(2)];return g?g.nome:"Gestor removido";}const p=S.prof[id];return (p&&p.name)||M.user[id]?.alcunha||(id===S.me.id?"Eu":"Utilizador");}
let profPending=new Set(),profTimer=0;
function wantProf(ids){ids.forEach(i=>{if(i&&!S.prof[i])profPending.add(i);});if(profPending.size&&U&&!profTimer){profTimer=setTimeout(async()=>{const list=[...profPending];profPending=new Set();profTimer=0;
  try{const r=await U.profiles(list);let ch=false;for(const k in r){if(!S.prof[k]||S.prof[k].name!==r[k].name){S.prof[k]=r[k];ch=true;}}if(ch)render();}catch(e){}},60);}}

/* ========== escrita ========== */
function errMsg(e){const c=e&&e.code;
  if(c==="invalid_argument")return"A alteração foi recusada: o seu nível de acesso não permite esta operação. Peça ao administrador.";
  if(c==="quota_exceeded")return"O armazenamento da plataforma está cheio. Contacte o administrador.";
  if(c==="resource_exhausted")return"Demasiadas operações seguidas. Aguarde uns segundos e tente de novo.";
  if(c==="revoked"||c==="not_granted")return"O acesso a esta página foi alterado. Recarregue a página.";
  return"Não foi possível guardar. Verifique a ligação e tente de novo.";}
async function W(fn,ok){try{const r=await fn();if(ok)toast(ok);return r;}catch(e){console.error(e);toast(errMsg(e),"bad");throw e;}}
function hist(p,acao,det){return [...(p.historico||[]),{em:nowISO(),por:S.me.id,acao,detalhe:det||""}].slice(-200);}
function notify(tipo,p,texto,para){if(!db)return;const id=(`${tipo}-${p.id}-${(p.historico||[]).length}`).replace(/[^A-Za-z0-9_\-.~:@+]/g,"_");
  db.collection("notificacoes").doc(id).set({tipo,pedidoId:p.id,numero:p.numero||"",texto,em:nowISO(),para,por:S.me.id}).catch(()=>{});}
async function proximoNumero(){const ano=+partsLis(new Date()).year;const ref=db.doc("contadores/pedidos");
  for(let i=0;i<8;i++){try{const r=await ref.acquire({holder:(S.me.id||"anon")+rid(),ttlMs:6000});
      if(r.acquired){const s=await ref.get();const d=(s.exists&&s.data())||{};const n=(d.ano===ano?(d.n||0):0)+1;await ref.set({ano,n});return `PT${ano}-${String(n).padStart(4,"0")}`;}}
    catch(e){if(e&&e.code==="invalid_argument")break;}
    await sleep(300+Math.random()*500);}
  return `PT${ano}-X${Date.now().toString(36).toUpperCase().slice(-5)}`;}
async function savePed(p,patch,ok){await W(()=>db.doc("pedidos/"+p.id).update(patch),ok);}

/* ========== indicadores ========== */
function scope(){return S.d.pedidos.filter(p=>!p.arquivado&&p.numero&&pedidoVisivel(p));}
function vZona(v){if(!v)return null;if(v.virtual)return (CFG().pmZonas||{})[v.pm.id]||null;return v.zonaId||null;}
const zonaOf=p=>{const v=p.recurso&&p.recurso.origem==="propria"&&p.recurso.viaturaId?M.via[p.recurso.viaturaId]:null;return vZona(v);};
const catOf=p=>p.categoriaId||M.eq[p.equipamentoId]?.categoriaId;
const isC=p=>p.estado==="Concluído";
const origem=p=>p.recurso&&p.recurso.origem;
function fimPrevisto(p){if(p.previstoFim)return Date.parse(p.previstoFim);if(p.previstoInicio)return Date.parse(p.previstoInicio)+CFG().duracaoPadraoH*3600000;return null;}
function emAtraso(p,now=Date.now()){if(FINAIS.includes(p.estado)||p.estado==="Rascunho")return false;const tol=CFG().toleranciaMin*60000;let ref=null;
  if(p.estado==="Em execução")ref=fimPrevisto(p);else if(p.estado==="Agendado")ref=p.previstoInicio?Date.parse(p.previstoInicio):null;else ref=p.pretendidaEm?Date.parse(p.pretendidaEm):null;
  return ref!=null&&now>ref+tol;}
function prazoRef(p){const r=CFG().refPrazo;return p[r]||null;}
function dentroPrazo(p){if(!isC(p))return null;const pr=prazoRef(p);if(!pr||!p.conclusaoEfetiva)return null;return Date.parse(p.conclusaoEfetiva)<=Date.parse(pr)+CFG().toleranciaMin*60000;}
const tAprov=p=>p.aprovadoEm&&p.submetidoEm?Date.parse(p.aprovadoEm)-Date.parse(p.submetidoEm):null;
const tResp=p=>p.inicioEfetivo&&p.criadoEm?Date.parse(p.inicioEfetivo)-Date.parse(p.criadoEm):null;
const tExec=p=>p.conclusaoEfetiva&&p.inicioEfetivo?Date.parse(p.conclusaoEfetiva)-Date.parse(p.inicioEfetivo):null;
function extStats(list){const c=list.filter(isC);const e=c.filter(p=>origem(p)==="externa").length;const o=c.filter(p=>origem(p)==="propria").length;
  return {n:c.length,e,o,semOrigem:c.length-e-o,p:c.length?e/c.length*100:null};}
function prazoStats(list){const c=list.filter(isC);let d=0,f=0,inc=0;c.forEach(p=>{const r=dentroPrazo(p);if(r===true)d++;else if(r===false)f++;else inc++;});return{d,f,inc,p:(d+f)?d/(d+f)*100:null};}
function custoStats(list,orig){const c=list.filter(p=>isC(p)&&(!orig||origem(p)===orig));const v=c.map(p=>numOr(p.recurso?.custoEfetivo)).filter(x=>x!=null);return{n:v.length,total:v.reduce((s,x)=>s+x,0),media:avg(v)};}
function viaturasUsadas(list){const s=new Set();list.filter(isC).forEach(p=>{const r=p.recurso||{};if(r.origem==="propria"&&r.viaturaId)s.add("v:"+r.viaturaId);else if(r.origem==="externa")s.add("x:"+(r.matricula||r.transportadoraId||p.id));});return s.size;}
function cargaTxt(c){if(!c)return"";const d=[c.c,c.l,c.a].some(x=>x!=null)?`${[c.c,c.l,c.a].map(x=>x==null?"?":x.toLocaleString("pt-PT")).join(" × ")} m`:"";
  return [c.descricao||M.mat[c.materialId]?.nome,d,c.peso!=null?c.peso.toLocaleString("pt-PT")+" t":"",c.volumes!=null?c.volumes+" vol.":""].filter(Boolean).join(" · ");}
function matDesc(p){switch(p.tipo){case"viatura":return `${eqName(p.equipamentoId)}${p.variante?" · "+p.variante:""} · ${fmtDT(p.periodoInicio)} → ${fmtDT(p.periodoFim)}`;
  case"armazem":return `${/^box/i.test(p.box||"")?p.box:"Box "+(p.box||"—")} · ${cargaTxt(p.carga)}`;case"fornecedor":return `${p.fornecedorNome||"Fornecedor"} · ${cargaTxt(p.carga)}`;
  case"recolha":return `${p.nCargas||"?"} carga(s)${p.carga&&p.carga.descricao?" · "+p.carga.descricao:""}`;
  case"cisterna":{const c=p.carga||{};return [M.mat[c.materialId]?.nome||c.descricao,c.peso!=null?c.peso.toLocaleString("pt-PT")+" t":"",`${p.nCargas||1} carga(s)`,p.janelaDescarga].filter(Boolean).join(" · ");}
  case"maquina":return (p.maquinas||[]).map(m=>String(m.label||"").replace(/^#\S+ · /,"")).join(" + ");
  default:return (p.linhas||[]).map(l=>M.mat[l.materialId]?.nome||l.descricao).filter(Boolean).join(", ");}}
function resumoHtml(p){const n=p.tipo==="maquina"&&p.analise?NIVEL[p.analise.nivel]:null;return esc(matDesc(p)||"—")+(n?` <span class="chip ${n[1]}">${n[0]}</span>`:"");}
function eqTxt(p){return p.equipamentoId?eqName(p.equipamentoId)+(p.variante?" · "+p.variante:""):(TIPO_SHORT[p.tipo]||"—");}
function chipT(p){return `<span class="chip c-idle">${esc(TIPO_SHORT[p.tipo]||"—")}</span>`;}
const optTipos=l=>opt0(l).concat(TIPOS.map(t=>[t.k,TIPO_SHORT[t.k]]));
function eqName(id){return M.eq[id]?.nome||"—";}
function destTxt(p){return p.obraId?obraName(p.obraId):(p.cliente?p.cliente:"—");}
function obraName(id){const o=M.obra[id];return o?`${o.codigo} · ${o.nome}`:"—";}
function recursoTxt(p){const r=p.recurso||{};if(r.origem==="propria"){const v=M.via[r.viaturaId];return v?`${v.ident}${v.matricula?" · "+v.matricula:""}`:"Frota própria (sem viatura)";}
  if(r.origem==="externa")return `${M.tr[r.transportadoraId]?.nome||"Externo"}${r.matricula?" · "+r.matricula:""}`;return"—";}

/* filtros comuns de análise */
function applyAF(list,f,dateFn){return list.filter(p=>(!f.tipo||p.tipo===f.tipo)&&(!f.zona||zonaOf(p)===f.zona)&&(!f.obra||p.obraId===f.obra)&&(!f.cat||catOf(p)===f.cat)&&(!f.eq||eqIn(f.eq,p.equipamentoId))&&(!f.origem||origem(p)===f.origem)&&(!f.transp||p.recurso?.transportadoraId===f.transp)&&inRange(dateFn(p),f.de,f.ate));}
function drill(key,label,list){S.drill[key]={label,ids:list.map(p=>p.id)};return key;}

/* ========== conflitos ========== */
function conflitos(){const cfg=CFG(),now=Date.now(),out=[];const ps=scope();
  const act=ps.filter(p=>["Agendado","Em execução"].includes(p.estado)&&p.previstoInicio);
  const win=p=>[Date.parse(p.previstoInicio),fimPrevisto(p)];
  const pairs=(keyFn,tipo)=>{const g=groupBy(act.filter(keyFn),keyFn);g.forEach((arr,k)=>{arr.sort((a,b)=>win(a)[0]-win(b)[0]);for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){const[a0,a1]=win(arr[i]),[b0]=win(arr[j]);if(b0<a1){
    out.push({key:`${tipo==="Viatura"?"sv":"sm"}_${arr[i].id}_${arr[j].id}`,tipo:tipo==="Viatura"?"Mesma viatura em transportes simultâneos":"Sobreposição do mesmo motorista",ped:[arr[i],arr[j]],txt:tipo==="Viatura"?(M.via[k.slice(2)]?.ident||"Viatura"):k.slice(2)});}}});};
  pairs(p=>p.recurso?.origem==="propria"&&p.recurso.viaturaId?"v:"+p.recurso.viaturaId:null,"Viatura");
  pairs(p=>p.recurso?.motorista?"m:"+p.recurso.motorista.trim().toLowerCase():null,"Motorista");
  act.forEach(p=>{const r=p.recurso||{};
    if(r.origem==="propria"&&r.viaturaId){const v=M.via[r.viaturaId];if(v&&(v.disponibilidade||"disponivel")!=="disponivel"&&p.estado==="Agendado")out.push({key:`ind_${p.id}`,tipo:"Viatura ou equipamento indisponível",ped:[p],txt:`${v.ident}: ${v.disponibilidade==="manutencao"?"em manutenção":"indisponível"}`});
      if(v&&v.equipamentoId&&v.equipamentoId!==p.equipamentoId)out.push({key:`teq_${p.id}`,tipo:"Tipo de equipamento diferente do pedido",ped:[p],txt:`${v.ident} é ${eqName(v.equipamentoId)}; pedido de ${eqName(p.equipamentoId)}`});}
    if(!(r.origem==="propria"&&r.viaturaId)&&!(r.origem==="externa"&&(r.transportadoraId||r.matricula)))out.push({key:`sr_${p.id}`,tipo:"Sem viatura ou equipamento atribuído",ped:[p],txt:r.origem==="externa"?"Transportadora por indicar":"Viatura por indicar"});});
  ps.filter(p=>["Pendente de aprovação","Aprovado","Por agendar","Devolvido para correção"].includes(p.estado)&&p.pretendidaEm&&Date.parse(p.pretendidaEm)-now<cfg.alertaH*3600000)
    .forEach(p=>out.push({key:`np_${p.id}`,tipo:Date.parse(p.pretendidaEm)<now?"Data pretendida ultrapassada sem planeamento":"Próximo da data pretendida e ainda não planeado",ped:[p],txt:`Pretendido para ${fmtPed(p.pretendidaEm,p.pretendidaSemHora)}`}));
  return out.filter(c=>!c.ped.every(p=>p.justificacoes&&p.justificacoes[c.key]));}

/* ========== notificações ========== */
function lidasAte(){try{return localStorage.getItem("notifLidas")||"";}catch(e){return"";}}
function minhasNotifs(){const r=role();const alvo=[`u:${S.me.id}`,`perfil:${r}`];if(r==="admin")alvo.push("perfil:logistica");
  return S.d.notificacoes.filter(n=>n.por!==S.me.id&&(n.para||[]).some(x=>alvo.includes(x))).sort((a,b)=>b.em.localeCompare(a.em));}
function alertasCalc(){if(!can.log())return scope().filter(p=>p.criadoPor===S.me.id&&emAtraso(p)).map(p=>({txt:`${p.numero} em atraso`,p}));
  const now=Date.now(),h=CFG().alertaH*3600000,out=[];
  scope().forEach(p=>{if(emAtraso(p))out.push({txt:`${p.numero} em atraso (${p.estado})`,p,cls:"bad"});
    else if(p.estado==="Agendado"&&p.previstoInicio&&Date.parse(p.previstoInicio)-now<h&&Date.parse(p.previstoInicio)>now)out.push({txt:`${p.numero} executa às ${fmtT(p.previstoInicio)} de ${fmtD(dayKey(p.previstoInicio))}`,p});});
  const nc=conflitos().length;if(nc)out.unshift({txt:`${nc} conflito(s) por resolver na agenda`,route:"agenda",cls:"warn"});return out;}

function get(path){return path.split(".").reduce((o,k)=>o==null?undefined:o[k],S);}

function lineChart(keys,series,o={}){if(!keys.length)return `<div class="empty">Sem dados para mostrar a evolução.</div>`;
  const W=640,H=200,L=40,R=14,T=12,B=30;const all=series.flatMap(s=>s.vals.filter(v=>v!=null));let max=Math.max(1,...all);if(o.pct)max=100;else{const p=Math.pow(10,Math.floor(Math.log10(max)));max=Math.ceil(max/p)*p;}
  const x=i=>L+(keys.length===1?(W-L-R)/2:i*(W-L-R)/(keys.length-1)),y=v=>T+(H-T-B)*(1-v/max);
  let g="";for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yy+3}" text-anchor="end">${o.pct?Math.round(v)+"%":Math.round(v)}</text>`;}
  const step=Math.ceil(keys.length/8);keys.forEach((k,i)=>{if(i%step===0||i===keys.length-1)g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${esc(o.lab?o.lab(k):k)}</text>`;});
  series.forEach(s=>{const pts=s.vals.map((v,i)=>v==null?null:[x(i),y(v)]);let d="",pen=false;pts.forEach(p=>{if(!p){pen=false;return;}d+=(pen?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1);pen=true;});
    if(o.area&&series.length===1&&pts.every(p=>p))g+=`<path d="${d}L${x(keys.length-1)},${y(0)}L${x(0)},${y(0)}Z" fill="${s.c}" opacity=".12"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2"/>`;pts.forEach((p,i)=>{if(p)g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4:2.5}" fill="${s.c}"><title>${esc((o.lab?o.lab(keys[i]):keys[i])+" · "+s.n+": "+(o.pct?pct(s.vals[i]):s.vals[i]))}</title></circle>`;});});
  return `${series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join("")}</div>`:""}<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||"Evolução")}">${g}</svg></div>`;}
function seriesKeys(list,dateFn,gran,max=24){const ks=[...new Set(list.map(dateFn).filter(Boolean).map(d=>periodKey(d,gran)))].sort();return ks.slice(-max);}

  return `<div class="phead"><div><h1>Resultados para “${esc(S.gq.trim())}”</h1><p>${ps.length} pedido(s) e ${os.length} obra(s).</p></div><button class="btn" data-act="clrq">Limpar pesquisa</button></div>

  <div class="kpis">${K("Total de pedidos",base.length,"no período",base)}${K("Pendentes de aprovação",cnt("Pendente de aprovação").length,"",cnt("Pendente de aprovação"),cnt("Pendente de aprovação").length?"warn":"")}
  ${K("Aprovados por agendar",cnt("Por agendar").length+cnt("Aprovado").length,"",[...cnt("Por agendar"),...cnt("Aprovado")])}${K("Agendados",cnt("Agendado").length,"",cnt("Agendado"))}${K("Em execução",cnt("Em execução").length,"",cnt("Em execução"))}
  ${K("Concluídos",conc.length,`${viaturasUsadas(base)} viatura(s) utilizadas`,conc,"ok")}${K("Em atraso",atr.length,"",atr,atr.length?"bad":"")}${K("Urgentes em aberto",urg.length,"",urg,urg.length?"bad":"")}
  ${K("Criação → aprovação",fmtDur(avg(base.map(p=>p.aprovadoEm&&p.criadoEm?Date.parse(p.aprovadoEm)-Date.parse(p.criadoEm):null))),`média · n=${base.filter(p=>p.aprovadoEm).length}`)}
  ${K("Criação → execução",fmtDur(avg(tr)),`média · n=${tr.length}`)}${K("Dentro do prazo",pct(ps.p),`${ps.d} de ${ps.d+ps.f} com prazo · ${ps.inc} incompletos`,null,ps.p!=null&&ps.p<80?"warn":"")}
  ${K("Frota própria",xs.n?pct(xs.o/xs.n*100):"Sem dados",`${xs.o} de ${xs.n} concluídos`,cOwn)}${K("Veículos externos",pct(xs.p),`${xs.e} de ${xs.n} concluídos`,cExt)}</div>

function refPrazoLabel(){return {previstoFim:"data e hora previstas de conclusão",previstoInicio:"data e hora previstas de início",pretendidaEm:"data e hora pretendidas pela obra"}[CFG().refPrazo];}

/* ========== PEDIDOS ========== */
function pedFilt(){const f=S.f.ped,q=f.q.trim().toLowerCase();let ps=scope();
  if(f.ids){const s=new Set(f.ids);ps=ps.filter(p=>s.has(p.id));}
  return ps.filter(p=>(!q||matchQ(p,q))&&(!f.tipo||p.tipo===f.tipo)&&(!f.estado||p.estado===f.estado)&&(!f.prioridade||p.prioridade===f.prioridade)&&(!f.zona||zonaOf(p)===f.zona)&&(!f.obra||p.obraId===f.obra)&&(!f.cat||catOf(p)===f.cat)&&(!f.eq||eqIn(f.eq,p.equipamentoId))
    &&(!f.mat||(p.carga&&p.carga.materialId===f.mat)||(p.linhas||[]).some(l=>l.materialId===f.mat))&&(!f.origem||origem(p)===f.origem)&&(!f.transp||p.recurso?.transportadoraId===f.transp)&&(!f.gestor||filtroGestor(p,f.gestor,true))
    &&inRange(p.criadoEm,f.cDe,f.cAte)&&inRange(p.previstoInicio,f.pDe,f.pAte)&&inRange(p.inicioEfetivo,f.eDe,f.eAte)&&(!f.atraso||emAtraso(p)));}

  {k:"mat",l:"Pedido",v:p=>resumoHtml(p),s:p=>matDesc(p)},{k:"eq",l:"Equipamento",v:p=>esc(eqTxt(p)),s:p=>eqTxt(p)},
  {k:"pretendidaEm",l:"Pretendido",v:p=>`<span class="num">${fmtPed(p.pretendidaEm,p.pretendidaSemHora)}</span>`},{k:"previstoInicio",l:"Previsto",v:p=>`<span class="num">${fmtDT(p.previstoInicio)}</span>`},
  {k:"origem",l:"Origem",v:p=>chipO(p),s:p=>origem(p)},{k:"estado",l:"Estado",v:p=>chipE(p.estado)+chipAtr(p),s:p=>ESTADOS.indexOf(p.estado)},{k:"prioridade",l:"Prioridade",v:p=>chipP(p.prioridade),s:p=>PRIO_ORD[p.prioridade]}];}

function obraLocal(o){return o?[o.nome,o.morada].filter(Boolean).join(", "):"";}

  return {id:null,tipo:"",obraId:obrasMinhas.length===1?obrasMinhas[0].id:"",logisticaId:"",prioridade:"normal",urgente:false,categoriaId:"",equipamentoId:"",variante:"",periodoInicio:"",periodoFim:"",
    box:"",fornecedorId:"",fornecedorNome:"",cDesc:"",cMat:"",cC:"",cL:"",cA:"",cPeso:"",cVol:"",nCargas:"1",maquinas:[],maqClasse:"",maqQ:"",maqDisp:"",kmManual:"",
    localCarga:"",localDescarga:"",coordCarga:"",coordDescarga:"",pretendidaEm:"",instrucoes:"",restricoes:"",anexos:[],paraAprovacao:false,err:"",_auto:{c:"",d:""}};}
function aplicarLocaisPadrao(F){const ol=obraLocal(M.obra[F.obraId]);const t=F.tipo;
  if(t==="viatura"){F.localCarga="";F.localDescarga=ol;}
  else if(t==="armazem"){F.localCarga="Armazém / Pré-fabricados";F.localDescarga=ol;}
  else if(t==="fornecedor"){const f=M.forn[F.fornecedorId];F.localCarga=f?(f.morada||f.nome):"";F.localDescarga=ol;}
  else if(t==="recolha"){F.localCarga=ol;F.localDescarga="";}
  else if(t==="maquina"){const n=F.maquinas[0];F.localCarga=(n&&PS.eqLoc[n]&&PS.eqLoc[n].loc)||"";F.localDescarga=ol;}
  {const ob=M.obra[F.obraId],oc=ob&&ob.localizacao||"";if(oc){if(F.tipo==="recolha"){if(!F.coordCarga||F.coordCarga===(F._auto||{}).cc)F.coordCarga=oc;}else if(F.tipo&&F.tipo!=="recolha"){if(!F.coordDescarga||F.coordDescarga===(F._auto||{}).cd)F.coordDescarga=oc;}}}
  F._auto={c:F.localCarga,d:F.localDescarga,cc:F.tipo==="recolha"?F.coordCarga:"",cd:F.tipo!=="recolha"?F.coordDescarga:""};}
function onObraChange(F){const ol=obraLocal(M.obra[F.obraId]);if(!F.tipo)return;
  if(F.tipo==="recolha"){if(!F.localCarga||F.localCarga===F._auto.c)F.localCarga=ol;}
  else if(!F.localDescarga||F.localDescarga===F._auto.d)F.localDescarga=ol;
  {const ob=M.obra[F.obraId],oc=ob&&ob.localizacao||"";if(oc){if(F.tipo==="recolha"){if(!F.coordCarga||F.coordCarga===(F._auto||{}).cc)F.coordCarga=oc;}else if(F.tipo&&F.tipo!=="recolha"){if(!F.coordDescarga||F.coordDescarga===(F._auto||{}).cd)F.coordDescarga=oc;}}}
  F._auto={c:F.localCarga,d:F.localDescarga,cc:F.tipo==="recolha"?F.coordCarga:"",cd:F.tipo!=="recolha"?F.coordDescarga:""};}
function formAn(F){return{nums:F.maquinas,orig:parseCoords(F.coordCarga)?F.coordCarga:F.localCarga,dest:parseCoords(F.coordDescarga)?F.coordDescarga:F.localDescarga,km:F.kmManual,disp:fromInput(F.maqDisp),entregar:fromInput(F.pretendidaEm)};}
function vNovo(){if(!can.pedido())return denied();if(!S.form)S.form=novoForm();const F=S.form;const ed=F.id?M.ped[F.id]:null;dtSync(F);if(!F.id||F.tipo)autoLogForm(F);

  const head=`<div class="phead"><div><h1>${ed?`Editar pedido ${esc(ed.numero)}`:"Novo pedido de transporte"}</h1><p>Escolha o tipo de pedido; o formulário mostra só o que esse pedido precisa. Campos com * são obrigatórios para submeter.</p></div>${ed?`<button class="btn" data-act="cancelForm">Sair sem guardar</button>`:""}</div>

  const ident=`<section class="form-sec"><header><span class="k">2</span><h3>Obra e identificação</h3></header><div>
   ${fld("form.obraId",F.tipo==="cisterna"?"Obra (se aplicável)":"Obra",{type:"select",req:F.tipo!=="cisterna",opts:[["","Selecione a obra"]].concat(obras.map(o=>[o.id,`${o.codigo} · ${o.nome}${o.ativa===false?" (inativa)":""}`]))})}
   ${fld("form.logisticaId","Gestor de logística responsável",{type:"select",opts:optLogistica(F.logisticaId),hint:F.logisticaId&&F.logisticaId===F._autoLog?"Atribuído automaticamente pelo tipo de viatura. Pode mudar.":(F._autoLog?"":"Sem gestor definido para este tipo de viatura (Configurações › Serviços por tipo de viatura).")})}
   ${urg?"":fld("form.prioridade","Prioridade",{type:"select",opts:PRIOS})}

   <div class="fld"><span>Criado</span><div class="num">${ed?`${fmtDT(ed.criadoEm)} · ${esc(nome(ed.criadoPor))}`:"Automático"}</div></div>
   <div class="fld"><span>Estado</span><div>${chipE(ed?.estado||"Rascunho")}</div></div></div></section>`;
  return head+tipos+ident+secTipo(F)+secLocais(F)+secObs(F)+(F.err?`<div class="note bad">${esc(F.err)}</div>`:"")+
   `<div class="row" style="justify-content:flex-end;align-items:center">${fld("form.paraAprovacao","Para aprovação",{type:"check"})}<small class="muted" style="max-width:48ch">${F.paraAprovacao?"O pedido fica em Aprovações até a Logística o aprovar.":"Sem esta opção, o pedido entra logo na lista de pedidos, por agendar."}</small><button class="btn bad" data-act="anularForm">${F.id?"Cancelar edição":"Anular pedido"}</button><button class="btn" data-act="guardarPed" data-a="0">Guardar rascunho</button><button class="btn pri" data-act="guardarPed" data-a="1">${F.paraAprovacao?"Submeter para aprovação":"Submeter pedido"}</button></div>`;}

function normPlate(s){let t=String(s==null?"":s).toUpperCase().replace(/\s+/g,"").replace(/[–—]/g,"-");if(/^[A-Z0-9]{6}$/.test(t)&&/\d/.test(t)&&/[A-Z]/.test(t))t=t.slice(0,2)+"-"+t.slice(2,4)+"-"+t.slice(4);return t;}

function planoImportacao(res,existentes,pms,eqValidos,zonasL){const zDe=sd=>{const n=normNome(sd);if(!n)return null;const z=(zonasL||[]).find(z=>z.ativo!==false&&(normNome(z.nome)===n||n.startsWith(normNome(z.nome)+" ")));return z?z.id:null;};const ex=new Map(existentes.map(v=>[plateKey(v.matricula||v.ident),v]));const pmBy=new Map(pms.map(p=>[plateKey(p.trator),p]));

function planoData(){const f=S.f.ag,dia=f.data;const ps=agFilt(scope());

  ${S.d.eliminados.length?`<div class="panel" style="grid-column:1/-1"><h3>Registo de eliminações (${S.d.eliminados.length})</h3>${tbl("elim",[{k:"em",l:"Eliminado em",v:x=>`<span class="num">${fmtDT(x.em)}</span>`},{k:"col",l:"Tipo",v:x=>esc(COL_LAB[x.col]||x.col)},{k:"nome",l:"Registo"},{k:"por",l:"Por",v:x=>esc(nome(x.por))},{k:"r",l:"",nosort:true,v:x=>`<button class="btn sm" data-act="restaurar" data-a="${x.id}">Restaurar</button>`}],S.d.eliminados,{k:"em",d:"desc",size:20})}</div>`:""}

/* ========== MODAIS ========== */
function openPed(id){S.modal={t:"ped",id};render();}
function modalHtml(){const m=S.modal;const P=m.id?M.ped[m.id]:null;
  const wrap=(title,body,foot,narrow)=>`<div class="scrim" data-act="closeBg"><div class="drawer ${narrow?"narrow":""}" role="dialog" aria-modal="true" aria-label="${esc(title.replace(/<[^>]+>/g,""))}"><div class="dhd"><div>${title}</div><button class="btn ghost" data-act="close" aria-label="Fechar">✕</button></div><div class="mbody">${body}</div>${foot?`<div class="dft">${foot}</div>`:""}</div></div>`;
  if(m.t==="ped"){if(!P)return wrap("<h2>Pedido</h2>",`<div class="empty">Este pedido não existe ou não está visível para o seu perfil.</div>`);return wrap(`<div class="row">${pn(P)} ${chipT(P)} ${chipE(P.estado)} ${chipP(P.prioridade)}${chipAtr(P)}</div><h2 style="margin-top:6px">${esc(destTxt(P))}</h2>`,pedDetalhe(P),pedAcoes(P));}
  if(m.t==="decisao"){const L={aprovar:["Aprovar pedido","Aprovar","pri"],rejeitar:["Rejeitar pedido","Rejeitar","bad"],devolver:["Devolver para correção","Devolver","pri"]}[m.tipo];
    return wrap(`<h2>${L[0]} ${esc(P.numero)}</h2>`,`<p class="muted" style="margin:0">${esc(destTxt(P))} · ${esc(eqTxt(P))} · pretendido ${fmtPed(P.pretendidaEm,P.pretendidaSemHora)}</p>
      ${m.tipo==="aprovar"?fld("modal.f.prioridade","Prioridade",{type:"select",opts:PRIOS})+fld("modal.f.nota","Observação (opcional)",{type:"textarea"})+`<div class="note">Depois de aprovado, o pedido fica “Por agendar”. Pode agendá-lo de seguida.</div>`
      :fld("modal.f.motivo",m.tipo==="rejeitar"?"Motivo da rejeição":"O que deve ser corrigido",{type:"textarea",req:true,rows:4})}${m.err?`<div class="note bad">${esc(m.err)}</div>`:""}`,
      `<button class="btn" data-act="close">Voltar</button>${m.tipo==="aprovar"?`<button class="btn" data-act="doDecisao" data-a="agendar">Aprovar e agendar</button>`:""}<button class="btn ${L[2]}" data-act="doDecisao">${L[1]}</button>`,true);}
  if(m.t==="agendar")return wrap(`<h2>${P.estado==="Agendado"?"Reagendar":"Agendar"} ${esc(P.numero)}</h2>`,agendarBody(P,m),`<button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="doAgendar">${P.estado==="Agendado"?"Guardar alterações":"Agendar transporte"}</button>`);
  if(m.t==="iniciar")return wrap(`<h2>Iniciar execução ${esc(P.numero)}</h2>`,`${fld("modal.f.inicio","Data e hora efetivas de início",{type:"datetime-local",req:true})}<p class="muted">Previsto: ${fmtDT(P.previstoInicio)}</p>`,`<button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="doIniciar">Marcar em execução</button>`,true);
  if(m.t==="concluir")return wrap(`<h2>Confirmar conclusão ${esc(P.numero)}</h2>`,`${!P.inicioEfetivo?fld("modal.f.inicio","Data e hora efetivas de início",{type:"datetime-local",req:true}):`<p class="muted" style="margin:0">Início efetivo: ${fmtDT(P.inicioEfetivo)}</p>`}${fld("modal.f.fim","Data e hora efetivas de conclusão",{type:"datetime-local",req:true})}
      ${fld("modal.f.custoEfetivo","Custo efetivo (€)",{type:"number",step:"0.01",min:0,hint:"Opcional. Deixe vazio se ainda não for conhecido."})}${fld("modal.f.ocorrencia","Ocorrências, atrasos ou alterações",{type:"textarea"})}
      <div class="fld"><span>Comprovativo de execução</span>${anexosHtml(m.f.comprovativos,true,"modal")}</div>${m.err?`<div class="note bad">${esc(m.err)}</div>`:""}`,`<button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="doConcluir">Confirmar conclusão</button>`,true);
  if(m.t==="cancelar")return wrap(`<h2>Cancelar ${esc(P.numero)}</h2>`,`<div class="note warn">O pedido fica cancelado e não conta como execução. O histórico mantém-se.</div>${fld("modal.f.motivo","Motivo do cancelamento",{type:"textarea",req:true})}${m.err?`<div class="note bad">${esc(m.err)}</div>`:""}`,`<button class="btn" data-act="close">Voltar</button><button class="btn bad" data-act="doCancelar">Cancelar pedido</button>`,true);
  if(m.t==="ocorr")return wrap(`<h2>Registar ocorrência ${esc(P.numero)}</h2>`,fld("modal.f.texto","Ocorrência, atraso ou alteração",{type:"textarea",req:true,rows:4}),`<button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="doOcorr">Registar</button>`,true);
  if(m.t==="custo")return wrap(`<h2>Atualizar custo ${esc(P.numero)}</h2>`,fld("modal.f.custoEfetivo","Custo efetivo (€)",{type:"number",step:"0.01",min:0}),`<button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="doCusto">Guardar</button>`,true);
  if(m.t==="justificar"){const c=conflitos().find(x=>x.key===m.key);if(!c)return wrap("<h2>Conflito</h2>",`<div class="empty">Este conflito já foi resolvido.</div>`,"",true);
    return wrap(`<h2>Justificar conflito</h2>`,`<div class="note warn"><b>${esc(c.tipo)}</b><br>${c.ped.map(p=>esc(p.numero)).join(" + ")} · ${esc(c.txt)}</div>${fld("modal.f.texto","Justificação",{type:"textarea",req:true,ph:"Ex.: as duas cargas seguem na mesma viagem"})}`,`<button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="doJustificar">Guardar justificação</button>`,true);}
  if(m.t==="obra")return wrap(`<h2>${m.id?"Editar obra":"Nova obra"}</h2>`,obraForm(m),`<button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="saveObra">Guardar obra</button>`,true);
  if(m.t==="obraDet"){const o=M.obra[m.oid];if(!o)return wrap("<h2>Obra</h2>",`<div class="empty">Obra não encontrada.</div>`);

     ${fld("modal.f.empresa","Empresa",{type:"select",opts:[["CPSA","CPSA"],["PTSA","Pragosa Transportes"]]})}${fld("modal.f.sede","Sede do conjunto")}</div>
     ${fld("modal.f.reboquesTxt","Reboques (um por linha: matrícula · tipo)",{type:"textarea",rows:3,ph:"L-174917 · Cisterna Cimento"})}
     ${fld("modal.f.equipamentoId","Tipo de equipamento principal",{type:"select",opts:[["","Por definir"]].concat(eqs("",true).map(e=>[e.id,`${M.cat[e.categoriaId]?.nome||""} · ${e.nome}`])),hint:m.f.tipoTxt?`Na lista importada: ${m.f.tipoTxt}`:"Define o grupo da viatura no plano de cargas."})}
     <div class="grid g2">${fld("modal.f.zonaId","Zona operacional",{type:"select",opts:[["","Por definir"]].concat(zonas().map(z=>[z.id,z.nome]))})}${fld("modal.f.motorista","Motorista responsável")}${fld("modal.f.contacto","Contacto")}${fld("modal.f.disponibilidade","Disponibilidade",{type:"select",opts:[["disponivel","Disponível"],["indisponivel","Indisponível"],["manutencao","Em manutenção"]]})}<div class="fld"><span>&nbsp;</span>${fld("modal.f.suplente","Suplente",{type:"check"})}</div></div>
     ${fld("modal.f.obs","Observações operacionais",{type:"textarea"})}${fld("modal.f.ativo","Ativa",{type:"check"})}${m.err?`<div class="note bad">${esc(m.err)}</div>`:""}`,
     `<button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="saveSimple" data-a="viaturas">Guardar</button>`,true);
  if(m.t==="import"){const I=S.imp;if(!I)return "";const p=I.plano,r=I.res;

     ${I.folhas.length>1?fld("imp.folha","Folha",{type:"select",opts:I.folhas.map(x=>[x,x]),hint:"Por defeito, a última folha (a mais recente)."}):""}

     ${p.semEq.length?`<div class="note">Sem tipo de reboque na lista: ${esc(p.semEq.join(", "))}. Ficam “por definir”; defina o tipo de equipamento em Frota própria.</div>`:""}
     ${r.notas.length?`<div class="note">Notas da lista: ${r.notas.map(esc).join(" · ")}</div>`:""}

     <div class="fld"><span>Tipos de equipamento que disponibiliza</span><div class="row">${eqs("",true).map(e=>fld(`modal.f.eqs.${e.id}`,e.nome,{type:"check"})).join("")}</div></div>${fld("modal.f.obs","Observações",{type:"textarea"})}${fld("modal.f.ativo","Ativa",{type:"check"})}${m.err?`<div class="note bad">${esc(m.err)}</div>`:""}`,

     ${fld("modal.f.obs","Observações",{type:"textarea"})}${fld("modal.f.ativo","Ativo",{type:"check"})}${m.err?`<div class="note bad">${esc(m.err)}</div>`:""}`,
     `<button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="saveSimple" data-a="clientes">Guardar</button>`,true);
  if(m.t==="impCli"){const I=S.impCli;const nov=I.prods.filter(p=>!p.matId);return wrap(`<h2>Importar clientes de cisternas</h2>`,`<p class="muted" style="margin:0">${esc(I.nome)} · folha “${esc(I.folha)}” · ${I.rows.length} cliente(s) · ${I.prods.length} produto(s).</p>
     ${nov.length?`<div class="note">${nov.length} produto(s) ainda não existem em Materiais e vão ser criados como materiais de cisterna, com o nome exato da matriz: ${nov.map(p=>esc(p.nome)+(p.familiaId?` <small>(família ${esc(M.mat[p.familiaId]?.nome)})</small>`:"")).join(", ")}.</div>`:""}
     <div class="tw"><table class="mx"><thead><tr><th>Cliente</th>${I.prods.map(p=>`<th class="c">${esc(p.nome)}${p.matId&&normNome(M.mat[p.matId]?.nome)!==normNome(p.nome)?`<br><small>→ ${esc(M.mat[p.matId]?.nome)}</small>`:""}</th>`).join("")}</tr></thead><tbody>
     ${I.rows.map(r=>`<tr><td><b>${esc(r.nome)}</b>${r.existe?' <small class="muted">(atualiza)</small>':""}</td>${I.prods.map((p,j)=>`<td class="c">${r.tem[j]?"●":""}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`,
     `<button class="btn" data-act="close">Cancelar</button>${I.rows.length?`<button class="btn pri" data-act="doImpCli">Importar ${I.rows.length} cliente(s)</button>`:""}`);}

  if(m.t==="pmZona")return wrap(`<h2>Zona do conjunto ${esc(m.id)}</h2>`,fld("modal.f.zonaId","Zona operacional",{type:"select",opts:[["","Por definir"]].concat(zonas().map(z=>[z.id,z.nome]))}),`<button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="savePmZona">Guardar</button>`,true);

     ${I.rows.map((x,i)=>`<tr><td>${fld(`impC.rows.${i}.inc`,"",{type:"check"})}</td><td class="num">${x.data?fmtD(x.data):'<span class="chip c-bad">sem data</span>'}</td><td><b>${esc(x.cliente)}</b><br><small>${esc(x.produto)}</small></td>

    if(t.dataset.b==="form.fornecedorId"){const fo=M.forn[t.value];if(fo&&(!S.form.localCarga||S.form.localCarga===S.form._auto.c)){S.form.localCarga=fo.morada||fo.nome;S.form._auto.c=S.form.localCarga;}}
    if(/^f\.\w+\.cat$/.test(t.dataset.b)){setPath(t.dataset.b.replace(/cat$/,"eq"),"");}
    if(t.dataset.b==="modal.f.viaturaId"){const v=M.via[t.value];if(v&&v.motorista&&!S.modal.f.motorista)S.modal.f.motorista=v.motorista;}
    if(t.dataset.b.startsWith("f.")||t.dataset.b.startsWith("S."))Object.keys(S.pg).forEach(k=>S.pg[k]=0);
    render();return;}
  if(t.dataset&&t.dataset.assign){const pid=t.value;if(!pid)return;const vid=t.dataset.assign;A.agendar(pid);const f=S.modal.f,v=M.via[vid],P=M.ped[pid];f.origem="propria";f.viaturaId=vid;
    if(v){if(!f.motorista)f.motorista=(v.virtual?v.pm.mot:v.motorista)||"";if(!f.equipamentoId)f.equipamentoId=vEqs(v)[0]||"";}
    const ref=P.previstoInicio||P.periodoInicio||P.pretendidaEm;if(!ref||dayKey(ref)!==S.f.ag.data)f.inicio=S.f.ag.data+"T08:00";render();return;}
  if(t.dataset&&t.dataset.cli){const file=t.files[0];t.value="";if(!file)return;try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");const wb=XLSX.read(await file.arrayBuffer());
      const nm=wb.SheetNames.find(n=>/cistern/i.test(n))||wb.SheetNames[0];const r=parseMatrizClientes(XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:false,defval:null}));
      if(!r){toast(`A folha “${nm}” não tem o formato esperado (clientes na coluna A, produtos na linha 1).`,"bad");return;}
      S.impCli={nome:file.name,folha:nm,...r};S.modal={t:"impCli"};render();}catch(e){console.error(e);toast("Não foi possível ler o ficheiro Excel.","bad");}return;}
  if(t.dataset&&t.dataset.cis){const file=t.files[0];t.value="";if(!file)return;try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
      let rows=null;for(const n of wb.SheetNames){const r=parseCisternas(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}));if(r&&r.length){rows=r;break;}}
      S.impC={nome:file.name,rows:rows||[]};S.modal={t:"impCis"};render();}catch(e){console.error(e);toast("Não foi possível ler o ficheiro Excel.","bad");}return;}
  if(t.dataset&&t.dataset.lista){const file=t.files[0];t.value="";if(!file)return;try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
      S.imp={nome:file.name,wb,folhas:wb.SheetNames,folha:wb.SheetNames[wb.SheetNames.length-1],pm:true};impParse();S.modal={t:"import"};render();}catch(e){console.error(e);toast("Não foi possível ler o ficheiro Excel.","bad");}return;}
  if(t.dataset&&t.dataset.up){const files=[...t.files];if(!files.length||!AS)return;const target=t.dataset.up==="form"?S.form.anexos:S.modal.f.comprovativos;toast("A carregar anexos…");
    for(const file of files){try{const r=await AS.upload(file);target.push({id:r.id,nome:file.name,tipo:r.contentType,tam:r.sizeBytes});}catch(err){toast(`Não foi possível carregar ${file.name}.`,"bad");}}render();toast("Anexos carregados.");}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ctxEl){hideCtx();return;}if(e.key==="Escape"){if(S.modal){S.modal=null;render();}else if(S.notifOpen){S.notifOpen=false;render();}}});
window.addEventListener("hashchange",route);
function route(){const h=(location.hash||"#dashboard").slice(1);S.route=NAV_ROUTES.some(n=>n[0]===h)?h:"dashboard";S.gq="";S.notifOpen=false;S.menu=false;render();window.scrollTo(0,0);}
let usT=0;function userSearch(){clearTimeout(usT);usT=setTimeout(async()=>{if(!U||S.uq.trim().length<2){S.uhits=[];return render();}try{S.uhits=await U.search(S.uq.trim());}catch(e){S.uhits=[];}render();},150);}
let tT=0;function toast(msg,cls){const el=$("#toast");el.innerHTML=`<div class="toast ${cls||""}" role="status">${esc(msg)}</div>`;clearTimeout(tT);tT=setTimeout(()=>el.innerHTML="",cls==="bad"?6000:3000);}

/* ========== render principal ========== */
function doRender(){buildMaps();const ae=document.activeElement;const id=ae&&ae.id;let s0=null,s1=null;try{s0=ae.selectionStart;s1=ae.selectionEnd;}catch(e){}
  const mb=document.querySelector(".mbody");const mst=mb?mb.scrollTop:0;
  $("#app").innerHTML=page();$("#modal").innerHTML=S.boot==="ready"&&S.modal?modalHtml():"";
  const mb2=document.querySelector(".mbody");if(mb2)mb2.scrollTop=mst;
  if(id){const el=document.getElementById(id);if(el&&el!==document.activeElement){el.focus({preventScroll:true});try{if(s0!=null)el.setSelectionRange(s0,s1);}catch(e){}}}
  placePlan();}
window.addEventListener("resize",()=>placePlan());window.addEventListener("scroll",()=>placePlan(),{passive:true});
function page(){if(S.boot==="nohost")return center("Sem ligação","Não foi possível ligar à base de dados. Recarregue a página.");
  if(S.boot==="nodb")return center("Sem acesso aos dados","Esta vista não consegue ligar à base de dados partilhada. Inicie sessão no Claude e abra a página a partir da ligação partilhada.");
  if(S.boot==="loading"||!COLS.filter(c=>c!=="acessos").every(c=>S.loaded[c]))return center("A carregar a plataforma…","A ligar à base de dados partilhada.");
  const r=role();
  if(!r){const mine=S.d.acessos.find(a=>a.id===S.me.id);
    if(mine&&mine.estado==="pendente")return center("Pedido de acesso enviado",`Pediu o perfil ${ROLE_LABEL[mine.perfil]} em ${fmtDT(mine.em)}. O administrador vai rever o pedido; esta página atualiza sozinha quando o acesso for aprovado.`);
    if(mine&&mine.estado==="recusado")return center("Acesso não aprovado","O seu pedido de acesso foi recusado. Fale com a Direção de Logística se precisar de acesso.");
    if(!S.me.id)return center("Inicie sessão","Para usar a plataforma tem de iniciar sessão no Claude.");
    return `<div class="center"><div class="panel"><h1>Pedir acesso à plataforma</h1><p class="muted">Ainda não tem perfil atribuído. Indique o perfil de que precisa; o administrador confirma.</p><div class="grid">${fld("req.perfil","Perfil pretendido",{type:"select",opts:[["logistica","Gestor de logística"],["consulta","Consulta e análise"]]})}${fld("req.nota","Nota para o administrador",{type:"textarea",ph:"Ex.: gestor da obra de Alenquer, nome e função"})}<button class="btn pri" data-act="pedirAcesso">Enviar pedido de acesso</button></div></div></div>`;}
  if(S.f.ped.ids===undefined)S.f.ped.ids=null;return shell();}
function center(t,p){return `<div class="center"><div class="panel"><h2>${esc(t)}</h2><p class="muted">${esc(p)}</p></div></div>`;}

/* ========== arranque ========== */
async function boot(){route();if(!window.claude||!window.claude.use){S.boot="nohost";return render();}
  [U,db]=await Promise.all([claude.use("user"),claude.use("db")]);
  if(!db){S.boot="nodb";return render();}
  const me=U?await U.me():{id:null,isOwner:false,canEdit:false,avatarUrl:""};const cw=U?await U.can("data.write"):null;
  S.me={id:me.id,isOwner:!!me.isOwner,canEdit:!!me.canEdit,canWrite:cw,avatar:me.avatarUrl||"",email:me.email||null,name:me.name||""};S.boot="ready";
  COLS.forEach(c=>{let q=db.collection(c);if(c==="notificacoes")q=q.orderBy("em","desc").limit(300);if(c==="pedidos")q=q.limit(1000);
    q.onSnapshot(s=>{S.d[c]=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded[c]=true;render();if(c==="convites"||c==="acessos"||c==="utilizadores")setTimeout(syncConvites,300);if(c==="convites"||c==="utilizadores"||c==="gestores")setTimeout(syncGestores,500);},e=>{console.warn(c,e);S.loaded[c]=true;render();});});
  claude.use("downloads").then(d=>DL=d);claude.use("assets").then(a=>{AS=a;render();});render();}
window.CPSA_READY.then(ok=>{if(!ok)return;if(/access_token|type=|error_description/.test(location.hash))history.replaceState(null,"",location.pathname+location.search);boot();});
</script>
